name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Java + Spring Boot. `mvn verify` runs unit tests (Surefire) and the
  # cross-tenant integration test (Failsafe + Testcontainers). GitHub-hosted
  # ubuntu runners provide a Docker daemon, so Testcontainers spins up real
  # Postgres + Redis.
  # ---------------------------------------------------------------------------
  api:
    name: API (build, test, verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile (lint/typecheck)
        run: mvn -B -ntp clean compile

      - name: Verify (unit + integration tests, package)
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: apps/api/target/site/jacoco/

  # ---------------------------------------------------------------------------
  # Frontend: React (Vite) + TypeScript. Lint, type-check, and production build.
  # ---------------------------------------------------------------------------
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
